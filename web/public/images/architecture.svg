<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Hybrid data center: how work flows</title>
  <desc id="d">Coding agents and scientists send work to a scheduler node. LLM steps go to a pool of GPU nodes. Quantum-eligible calls go to a shared QPU service, and the agent parks its session in a parking memory while the QPU job waits or runs.</desc>
  <defs>
    <marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker>
    <marker id="a-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8691aa"/></marker>
    <marker id="a-mag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d946ef"/></marker>
    <marker id="a-amb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e69f00"/></marker>
  </defs>

  <rect width="1200" height="500" rx="18" fill="#0c111d"/>

  <!-- Heading -->
  <text x="40" y="50" fill="#ebeff7" font-size="22" font-weight="700">How work flows in the hybrid data center</text>
  <text x="40" y="76" fill="#b3bccf" font-size="14">Tokens stay on GPUs. A scheduler sends each task where it is answered for the least cost, and an agent waiting for a QPU parks its session.</text>

  <!-- Users -->
  <rect x="40" y="170" width="210" height="110" rx="12" fill="#111828" stroke="rgba(255,255,255,0.14)"/>
  <text x="60" y="204" fill="#ebeff7" font-size="16" font-weight="650">Users and agents</text>
  <text x="60" y="230" fill="#b3bccf" font-size="13">Coding agents (case B)</text>
  <text x="60" y="250" fill="#b3bccf" font-size="13">Chemists, materials, biology,</text>
  <text x="60" y="268" fill="#b3bccf" font-size="13">mechanical, finance engineers</text>
  <path d="M250 225 H302" stroke="#8691aa" stroke-width="2" fill="none" marker-end="url(#a-grey)"/>

  <!-- Scheduler -->
  <rect x="310" y="175" width="250" height="100" rx="12" fill="#111828" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="332" y="210" fill="#ebeff7" font-size="18" font-weight="700">Scheduler node</text>
  <text x="332" y="238" fill="#b3bccf" font-size="13">may be a CPU or QPU node</text>
  <text x="332" y="258" fill="#8691aa" font-size="12">Re-plans as load changes</text>

  <!-- Trunk and branches -->
  <path d="M560 225 H610" stroke="#8691aa" stroke-width="2" fill="none"/>
  <path d="M610 150 V382" stroke="#8691aa" stroke-width="2" fill="none"/>
  <path d="M610 150 H652" stroke="#22d3ee" stroke-width="2.5" fill="none" marker-end="url(#a-cyan)"/>
  <text x="602" y="142" fill="#22d3ee" font-size="12" font-weight="600" text-anchor="end">LLM steps</text>
  <path d="M610 382 H652" stroke="#d946ef" stroke-width="3" fill="none" marker-end="url(#a-mag)"/>
  <text x="602" y="374" fill="#d946ef" font-size="12" font-weight="600" text-anchor="end">quantum</text>
  <text x="602" y="390" fill="#d946ef" font-size="12" font-weight="600" text-anchor="end">sub-tasks</text>

  <!-- GPU node pool -->
  <rect x="660" y="100" width="240" height="100" rx="12" fill="#111828" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="680" y="132" fill="#ebeff7" font-size="16" font-weight="650">GPU node pool</text>
  <text x="680" y="156" fill="#b3bccf" font-size="13">prefill + decode, tool calls</text>
  <text x="680" y="176" fill="#8691aa" font-size="12">identical nodes, any task</text>

  <!-- Parking memory -->
  <rect x="980" y="100" width="180" height="100" rx="12" fill="#111828" stroke="#e69f00" stroke-width="1.5"/>
  <text x="1000" y="132" fill="#ebeff7" font-size="16" font-weight="650">Parking memory</text>
  <text x="1000" y="156" fill="#b3bccf" font-size="13">sessions waiting</text>
  <text x="1000" y="176" fill="#8691aa" font-size="12">for a QPU job only</text>
  <path d="M902 150 H978" stroke="#e69f00" stroke-width="2" fill="none" marker-start="url(#a-amb)" marker-end="url(#a-amb)"/>
  <text x="940" y="140" fill="#e69f00" font-size="11" font-weight="600" text-anchor="middle">park / resume</text>

  <!-- QPU call from the GPU pool -->
  <path d="M780 202 V322" stroke="#d946ef" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#a-mag)"/>
  <text x="790" y="266" fill="#d946ef" font-size="12" font-weight="600">QPU call</text>

  <!-- Shared QPU service -->
  <rect x="660" y="330" width="500" height="106" rx="12" fill="#1a1230" stroke="#d946ef" stroke-width="1.5"/>
  <text x="680" y="360" fill="#ebeff7" font-size="16" font-weight="650">Shared QPU service <tspan fill="#e9a8f5" font-weight="400" font-size="13">· our addition</tspan></text>
  <text x="680" y="386" fill="#b3bccf" font-size="13">Chemistry, materials, biology calls; the agent parks while it waits or runs</text>
  <text x="680" y="408" fill="#8691aa" font-size="12">270 kW per QPU, shared by all GPU nodes</text>

  <!-- Footer -->
  <text x="40" y="474" fill="#8691aa" font-size="12">Earth only · all sites ≤ 500 MW · ≤ $30B. QPU figures: quantum_arch mid-2030s scenario. Call densities, classical costs and QPU price are assumptions.</text>
</svg>
